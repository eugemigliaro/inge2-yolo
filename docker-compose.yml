name: yolo

x-kafka-env: &kafka
  KAFKA_BROKERS: kafka:9092
x-db-env: &db
  DATABASE_URL: postgres://yolo:${POSTGRES_PASSWORD:-yolo}@postgres:5432/yolo

services:
  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes: [kafka:/var/lib/kafka/data]
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  # Crea el tópico con 3 particiones (clave = alumno) y retención infinita, para poder reprocesar la historia.
  kafka-init:
    image: apache/kafka:4.3.2
    depends_on: { kafka: { condition: service_healthy } }
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
      --topic juego.eventos --partitions 3 --replication-factor 1 --config retention.ms=-1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: yolo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yolo}
      POSTGRES_DB: yolo
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U yolo -d yolo
      interval: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: ./web
    environment:
      <<: [*kafka, *db]
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  proyector:
    build: ./workers
    command: node src/proyector.ts
    environment: { <<: [*kafka, *db] }
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  alertas:
    build: ./workers
    command: node src/alertas.ts
    environment:
      <<: [*kafka, *db]
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # Publica una vez el historial de prueba de Juana.
  seed:
    build: ./workers
    command: node src/seed.ts
    environment: *kafka
    depends_on: { kafka-init: { condition: service_completed_successfully } }

  mailpit:
    image: axllent/mailpit:v1.32
    ports: ["8025:8025"]
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: yolo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports: ["8080:8080"]
    depends_on: { kafka: { condition: service_healthy } }
    restart: unless-stopped

volumes:
  kafka:
  postgres:
